name: tests

# Registered here so that it can be started on demand on any branch (GitHub needs the file on the default branch):
#   gh workflow run test.yml --ref dev
# The automatic triggers (pushes to master, pull requests) arrive with the next release.
on:
  workflow_dispatch:

jobs:
  suite:
    name: test suite in the try-fm container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: try-fm/try-fm test

  macos:
    name: test suite on macOS (host, tools from brew)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install fzf ripgrep eza fd bat tmux
      - run: tests/run
