name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # on demand for any branch, e.g. gh workflow run test.yml --ref dev

jobs:
  suite:
    name: test suite in the try-fm container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # builds the image from the checkout (docker) and runs tests/run in it with the checkout mounted over /opt/fm
      - run: try-fm/try-fm test -x

  macos:
    name: test suite on macOS (host, tools from brew)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: brew install fzf ripgrep eza fd bat tmux
      - run: tests/run -x
